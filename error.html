<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body class="bg-gray-50">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full text-center">
        <div class="mb-8">
            <i class="fas fa-exclamation-triangle text-8xl text-yellow-500"></i>
        </div>
        <h1 class="text-6xl font-bold text-gray-800 mb-4">Oops!</h1>
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">Something went wrong</h2>
        <p class="text-gray-600 mb-8" th:text="${errorMessage}">An error occurred</p>
        <div class="space-x-4">
            <a href="/" class="inline-block bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition">
                <i class="fas fa-home mr-2"></i>Go Home
            </a>
            <button onclick="history.back()" class="inline-block border border-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-50 transition">
                <i class="fas fa-arrow-left mr-2"></i>Go Back
            </button>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
